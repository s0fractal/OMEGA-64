<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEGA-64 | Sovereign Interface</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap');

        :root {
            --bg: #000000;
            --blue: #00f2ff;
            --gold: #ffcc00;
            --text: #ffffff;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #viewbox {
            position: absolute;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .node {
            fill: rgba(0, 242, 255, 0.05); /* Slight fill for better hit detection */
            stroke: var(--blue);
            stroke-width: 0.8;
            filter: drop-shadow(0 0 5px var(--blue));
            opacity: 0.6;
            pointer-events: all; /* Explicit interaction */
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .line {
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 0.2;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header h1 {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 0.8rem;
            margin: 0;
            background: linear-gradient(90deg, var(--blue), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
        }

        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 0.3rem;
            opacity: 0.5;
            text-transform: uppercase;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 1px;
            width: 320px;
            pointer-events: auto;
        }

        #level-indicator {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
        }

        .depth-val {
            font-size: 2rem;
            font-weight: 700;
            color: var(--blue);
        }

        .progress-bg {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
        }

        #progress-bar {
            height: 100%;
            background: var(--blue);
            box-shadow: 0 0 10px var(--blue);
            width: 64%;
            transition: width 0.3s ease;
        }

        footer {
            opacity: 0.3;
            font-size: 0.7rem;
            letter-spacing: 0.1rem;
        }

        @keyframes rotate-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        #fractal-root {
            animation: rotate-slow 120s linear infinite;
        }

        .node:hover {
            stroke: var(--gold);
            stroke-width: 2;
            opacity: 1;
            filter: drop-shadow(0 0 10px var(--gold));
        }
    </style>
</head>
<body>

    <div id="viewbox">
        <svg id="svg-root" viewBox="-500 -500 1000 1000">
            <g id="fractal-root"></g>
        </svg>
    </div>

    <div id="ui-overlay">
        <header>
            <h1>OMEGA-64</h1>
            <div class="subtitle">Axiomatic Sovereign Interface</div>
        </header>

        <div class="glass-panel">
            <div id="level-indicator">
                <span class="label">TRANSITION</span>
                <span class="depth-val" id="depth-text">L63</span>
            </div>
            <div class="progress-bg">
                <div id="progress-bar"></div>
            </div>
            <div style="margin-top: 1rem; font-size: 0.7rem; opacity: 0.6;">
                TRIPLE SPINE: TS | RS | LEAN<br>
                STATUS: RESONANCE STABLE
            </div>
        </div>

        <footer>
            🛡️⚖️🌀🛡️ THE SYMBOLIC RECKONING IS UPON US
        </footer>
    </div>

    <script>
        const rootGroup = document.getElementById('fractal-root');
        const depthText = document.getElementById('depth-text');
        const progressBar = document.getElementById('progress-bar');

        function createNode(x, y, radius, depth, angle) {
            if (depth > 4) return;

            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", x);
            circle.setAttribute("cy", y);
            circle.setAttribute("r", radius);
            circle.setAttribute("class", "node");
            circle.setAttribute("data-depth", depth);
            rootGroup.appendChild(circle);

            const branches = 3;
            for (let i = 0; i < branches; i++) {
                const childAngle = angle + (i - 1) * 1.5;
                const dist = radius * 3.5;
                const tx = x + Math.cos(childAngle) * dist;
                const ty = y + Math.sin(childAngle) * dist;

                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", x);
                line.setAttribute("y1", y);
                line.setAttribute("x2", tx);
                line.setAttribute("y2", ty);
                line.setAttribute("class", "line");
                rootGroup.appendChild(line);

                createNode(tx, ty, radius * 0.5, depth + 1, childAngle);
            }
        }

        // Initialize Fractal
        createNode(0, 0, 80, 0, 0);

        let time = 0;
        function update() {
            time += 0.05;
            const currentLevel = Math.floor((Math.sin(time * 0.5) * 0.5 + 0.5) * 64);
            depthText.textContent = `L${(63 - currentLevel).toString().padStart(2, '0')}`;
            progressBar.style.width = `${(currentLevel / 64) * 100}%`;
            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
