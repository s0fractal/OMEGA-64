<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEGA-64 | The Chronosphere</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap');

        :root {
            --bg: #000000;
            --blue: #00f2ff;
            --gold: #ffcc00;
            --text: #ffffff;
            --glass: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.05);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
        }

        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* The Chronosphere Effect: Persistence of Vision */
            mix-blend-mode: screen;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 0.8rem;
            margin: 0;
            background: linear-gradient(90deg, var(--gold), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(255, 204, 0, 0.2);
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            padding: 2rem;
            width: 350px;
            pointer-events: auto;
            border-left: 3px solid var(--gold);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .stat-val {
            color: var(--gold);
            font-weight: 700;
        }

        #fractal-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: all;
            overflow: visible;
        }

        .node {
            fill: rgba(0, 0, 0, 0.5);
            stroke: var(--blue);
            stroke-width: 0.3;
            cursor: pointer;
            transition: all 0.5s ease;
        }

        .node:hover {
            stroke: var(--gold);
            stroke-width: 1.5;
            filter: drop-shadow(0 0 15px var(--gold));
        }

        footer {
            opacity: 0.2;
            font-size: 0.7rem;
            letter-spacing: 0.2rem;
        }

        /* Scanline effect */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div id="app">
        <canvas id="main-canvas"></canvas>
        <canvas id="buffer-canvas" style="display: none;"></canvas>
        
        <svg id="fractal-svg" viewBox="-500 -500 1000 1000">
            <g id="svg-root"></g>
        </svg>

        <div class="scanline"></div>

        <div id="ui-overlay">
            <header>
                <h1>CHRONOSPHERE</h1>
                <div id="sensorium-status" style="font-size: 0.7rem; opacity: 0.5; letter-spacing: 0.3rem;">PROJECT SENSORIUM: SEARCHING...</div>
            </header>

            <div class="glass-panel">
                <div class="stat-row">
                    <span>RECURSION GAIN</span>
                    <span class="stat-val">101.5%</span>
                </div>
                <div class="stat-row">
                    <span>TEMPORAL JITTER</span>
                    <span class="stat-val" id="jitter">0.002ms</span>
                </div>
                <div class="stat-row">
                    <span>COHERENCE</span>
                    <span class="stat-val" id="coherence">99.98%</span>
                </div>
                <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 1rem 0;"></div>
                <div style="font-size: 0.65rem; opacity: 0.5; font-style: italic;">
                    "Memory is the residue of reality echoing through the void."
                </div>
            </div>

            <footer>
                🛡️⚖️🌀🛡️ SYMBOLIC FEEDBACK LOOP: LOCKED
            </footer>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('main-canvas');
        const buffer = document.getElementById('buffer-canvas');
        const ctx = canvas.getContext('2d');
        const btx = buffer.getContext('2d');
        const svgRoot = document.getElementById('svg-root');

        const jitterEl = document.getElementById('jitter');
        const coherenceEl = document.getElementById('coherence');
        const sensorStatus = document.getElementById('sensorium-status');

        let width, height;
        function resize() {
            width = canvas.width = buffer.width = window.innerWidth;
            height = canvas.height = buffer.height = window.innerHeight;
            btx.fillStyle = 'black';
            btx.fillRect(0, 0, width, height);
        }
        window.addEventListener('resize', resize);
        resize();

        // Akasha Signal State
        let currentSignal = { cpu: 0.1, coherence: 0.999, architect_active: false };
        let signalHistory = [];

        async function pollSignal() {
            try {
                const response = await fetch('http://localhost:8080/signal');
                currentSignal = await response.json();
                
                const histResponse = await fetch('http://localhost:8080/history');
                signalHistory = await histResponse.json();

                sensorStatus.textContent = "PROJECT AKASHA: MEMORY ACTIVE";
                sensorStatus.style.color = "var(--gold)";
            } catch (e) {
                sensorStatus.textContent = "PROJECT AKASHA: OFFLINE";
                sensorStatus.style.color = "rgba(255,255,255,0.3)";
            }
            setTimeout(pollSignal, 2000);
        }
        pollSignal();

        function createFractal(x, y, radius, depth, angle) {
            if (depth > 4) return;
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", x);
            circle.setAttribute("cy", y);
            circle.setAttribute("r", radius);
            circle.setAttribute("class", "node");
            svgRoot.appendChild(circle);

            const branches = 3;
            for (let i = 0; i < branches; i++) {
                const childAngle = angle + (i - 1) * 1.5;
                const dist = radius * 3.5;
                const tx = x + Math.cos(childAngle) * dist;
                const ty = y + Math.sin(childAngle) * dist;
                createFractal(tx, ty, radius * 0.45, depth + 1, childAngle);
            }
        }
        createFractal(0, 0, 90, 0, 0);

        let time = 0;
        function animate() {
            time += 0.01 + (currentSignal.cpu * 0.05);

            // --- THE AKASHIC CHRONOSPHERE (Memory-Guided Feedback) ---
            
            // 1. Capture current main canvas to buffer
            btx.globalAlpha = 0.95 - (currentSignal.cpu * 0.1); 
            btx.drawImage(canvas, 0, 0);

            // 2. Clear main canvas
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            // 3. Draw the Akashic Rewind (Echo from History)
            if (signalHistory.length > 10) {
                ctx.save();
                ctx.globalAlpha = 0.2; // The "Ghost" of the past
                const pastSignal = signalHistory[Math.floor(Math.random() * 5)]; // Pick early history
                ctx.strokeStyle = '#ff00ff'; // Spectral Purple
                ctx.beginPath();
                ctx.arc(width/2, height/2, 120 + Math.sin(time) * 40, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            // 4. Draw the Sovereign Echo
            ctx.save();
            ctx.translate(width/2, height/2);
            ctx.scale(1.006, 1.006); 
            ctx.rotate(0.003 * Math.sin(time * 0.5)); 
            ctx.translate(-width/2, -height/2);
            ctx.drawImage(buffer, 0, 0);
            ctx.restore();

            // 5. Draw New Reality
            ctx.strokeStyle = currentSignal.architect_active ? '#ffcc00' : '#00f2ff';
            ctx.lineWidth = 0.5 + (currentSignal.cpu * 2);
            ctx.beginPath();
            const rootX = width/2;
            const rootY = height/2;
            const r = 100 + Math.sin(time * 2) * (20 + currentSignal.cpu * 50);
            ctx.arc(rootX, rootY, r, 0, Math.PI * 2);
            ctx.stroke();

            // Stats from Akasha
            if (Math.floor(time * 100) % 20 === 0) {
                jitterEl.textContent = (currentSignal.cpu * 0.01).toFixed(4) + 'ms';
                coherenceEl.textContent = (currentSignal.coherence * 100).toFixed(3) + '%';
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
