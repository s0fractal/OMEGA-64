<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>OMEGA-64 | Holographic Trinity</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        color: #0f0;
        font-family: monospace;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #ui {
        position: absolute;
        top: 10px;
        left: 10px;
        pointer-events: none;
        z-index: 10;
      }
      .mode-btn {
        pointer-events: auto;
        background: rgba(0, 50, 0, 0.8);
        border: 1px solid #0f0;
        color: #0f0;
        padding: 5px 10px;
        cursor: pointer;
        margin-right: 5px;
      }
      .mode-btn:hover {
        background: #0f0;
        color: #000;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <h1>OMEGA-64: Era 3.3</h1>
      <div id="status">Connecting to NERVE...</div>
      <br>
      <button class="mode-btn" onclick="setMode('CYLINDER')">CYLINDER</button>
      <button class="mode-btn" onclick="setMode('TORUS')">TORUS</button>
      <button class="mode-btn" onclick="setMode('ORBIT')">ORBIT</button>
    </div>
    <canvas id="stage"></canvas>

    <script>
      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d");
      const statusEl = document.getElementById("status");

      // State
      let socket;
      let points = [];
      let projectionMode = "CYLINDER";
      let camAngle = 0;
      let camY = 0;
      let isDragging = false;
      let lastMouseX = 0;

      // Resize
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resize);
      resize();

      // Input
      canvas.addEventListener("mousedown", (e) => {
        isDragging = true;
        lastMouseX = e.clientX;
      });
      canvas.addEventListener("mouseup", () => isDragging = false);
      canvas.addEventListener("mousemove", (e) => {
        if (isDragging) {
          const dx = e.clientX - lastMouseX;
          camAngle += dx * 0.01;
          lastMouseX = e.clientX;
        }
      });

      function setMode(m) {
        projectionMode = m;
        statusEl.innerText = `Mode: ${m}`;
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: "SET_MODE", payload: m }));
        }
      }

      // 3D Projection Logic (Client-Side Mirror of i.L64.core.PROJECTION.ts)
      function project3D(x, y, z) {
        // Apply Camera Rotation (around Y axis)
        const cos = Math.cos(camAngle);
        const sin = Math.sin(camAngle);

        // Rotate X, Z
        const rx = x * cos - z * sin;
        const rz = x * sin + z * cos;

        // Perspective
        const fov = 500;
        const viewerZ = 800; // Distance from camera to center

        const scale = fov / (fov + viewerZ + rz);

        const screenX = (canvas.width / 2) + (rx * scale);
        const screenY = (canvas.height / 2) + (y * scale);

        return { x: screenX, y: screenY, scale, zIndex: rz };
      }

      // Rendering Loop
      function draw() {
        // Fade Trail
        ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Sort points by Z for Painter's Algorithm
        const projected = points.map((p) => {
          if (
            p.x !== undefined && p.y !== undefined && p.z !== undefined
          ) {
            // Use server-side coordinates directly
            return {
              ...project3D(p.x, p.y, p.z),
              color: p.color,
              val: p.val,
            };
          }

          // Fallback: Generate geometry on the fly
          let x, y, z;

          // Assuming p has {val, i} or similar raw data.
          // Actually, NERVE sends raw `state_i16`.
          // Let's re-calculate logical geometry here because we receive raw state.

          const norm = p.val / 32768.0;
          const phase = p.i / 64 * Math.PI * 2 * 2; // 2 windings

          const RADIUS = 200;

          if (projectionMode === "CYLINDER") {
            const r = RADIUS + (norm * 50);
            x = r * Math.cos(phase);
            z = r * Math.sin(phase);
            y = (p.i - 32) * 10;
          } else if (projectionMode === "TORUS") {
            const R = 200, rCheck = 80;
            const phi = norm * Math.PI * 2;
            x = (R + rCheck * Math.cos(phi)) * Math.cos(phase);
            z = (R + rCheck * Math.cos(phi)) * Math.sin(phase);
            y = rCheck * Math.sin(phi);
          } else {
            // ORBIT
            const r = RADIUS + Math.random() * 10; // Jitter
            x = r * Math.cos(phase + camAngle);
            z = r * Math.sin(phase + camAngle);
            y = (p.i - 32) * 10;
          }

          return { ...project3D(x, y, z), color: p.color, val: p.val };
        });

        projected.sort((a, b) => b.zIndex - a.zIndex);

        projected.forEach((p) => {
          if (p.scale < 0) return; // Behind camera clipping

          ctx.beginPath();
          const size = Math.max(
            1,
            4 * p.scale + (Math.abs(p.val) / 10000),
          );
          ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();

          // Glow
          if (Math.abs(p.val) > 10000) {
            ctx.shadowBlur = 10;
            ctx.shadowColor = p.color;
          } else {
            ctx.shadowBlur = 0;
          }
        });

        camAngle += 0.005; // Auto rotate
        requestAnimationFrame(draw);
      }

      // Connection
      function connect() {
        socket = new WebSocket("ws://localhost:8080"); // Use 8083 if needed

        socket.onopen = () => {
          statusEl.innerText = "ONLINE: Connected to OMEGA-64";
          statusEl.style.color = "#0f0";
        };

        socket.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);

            if (data.type === "HOLOGRAM" && data.data) {
              const payload = data.data;

              if (payload.points) {
                // Use Server-Side Normative Coordinates
                points = payload.points.map((p, i) => {
                  let r = 0, g = 255, b = 0;
                  if (p.norm > 0.3) {
                    r = 255;
                    g = 100;
                    b = 100;
                  } else if (p.norm < -0.3) {
                    r = 100;
                    g = 100;
                    b = 255;
                  } else {
                    r = 0;
                    g = 255;
                    b = 100;
                  }
                  return {
                    ...p,
                    val: p.norm * 32768,
                    color: `rgb(${r},${g},${b})`,
                  };
                });
              } else if (payload.state_i16) {
                // Fallback to client-side projection
                points = Object.values(payload.state_i16).map(
                  (val, i) => {
                    let r = 0, g = 255, b = 0;
                    if (val > 10000) {
                      r = 255;
                      g = 100;
                      b = 100;
                    } else if (val < -10000) {
                      r = 100;
                      g = 100;
                      b = 255;
                    } else {
                      r = 0;
                      g = 255;
                      b = 100;
                    }
                    return { val, i, color: `rgb(${r},${g},${b})` };
                  },
                );
              }
            }
          } catch (e) {
            console.error("Frame Error:", e);
          }
        };

        socket.onclose = () => {
          statusEl.innerText = "OFFLINE: Retrying...";
          statusEl.style.color = "#f00";
          setTimeout(connect, 2000);
        };
      }

      connect();
      draw();
    </script>
  </body>
</html>
