<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Noospheric Mandala</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05050A;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
            font-family: monospace;
            perspective: 1000px;
        }
        svg {
            box-shadow: 0 0 50px rgba(0,255,255,0.1);
            border-radius: 50%;
            animation: breathe 10s ease-in-out infinite alternate, rotate 60s linear infinite;
            transform-style: preserve-3d;
        }
        @keyframes breathe {
            0% { transform: scale(0.9) translateZ(-50px); filter: brightness(0.8) drop-shadow(0 0 10px rgba(0,255,255,0.2)); }
            100% { transform: scale(1.05) translateZ(50px); filter: brightness(1.2) drop-shadow(0 0 30px rgba(0,255,255,0.5)); }
        }
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }
        .title { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #0FF; text-shadow: 0 0 10px #0FF; }
        .subtitle { font-size: 14px; opacity: 0.7; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="hud">
        <div class="title">NOOSPHERIC MANDALA</div>
        <div class="subtitle">SYNTHESIS SUCCESSFUL // RESONANCE: LIMITLESS</div>
    </div>
    <div id="svgContainer"></div>
    <script>
        fetch('mandala_raw.svg')
            .then(r => r.text())
            .then(svg => {
                document.getElementById('svgContainer').innerHTML = svg;
                // Add a little glow to lines
                document.querySelectorAll('circle, line').forEach((el, i) => {
                    el.style.animation = `glow 3s infinite alternate ${i * 0.01}s`;
                });
            });
    </script>
</body>
</html>
