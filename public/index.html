<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEGA-64 | The Panopticon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --glass-bg: rgba(24, 24, 27, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f4f4f5;
            --text-dim: #a1a1aa;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --danger: #ef4444;
            --architect: #8b5cf6;
            --membrane: #f97316;
            --producer: #eab308;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: "Outfit", sans-serif;
            background-image: radial-gradient(circle at 15% 50%, rgba(20, 20, 30, 0.8), transparent 25%), radial-gradient(circle at 85% 30%, rgba(20, 30, 20, 0.6), transparent 25%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow: hidden; /* Prevent scrolling */
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            background: linear-gradient(180deg, rgba(9, 9, 11, 0.9) 0%, rgba(9, 9, 11, 0.4) 100%);
            backdrop-filter: blur(12px);
            z-index: 100;
        }

        .title-group h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #fff, #a1a1aa);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-group .subtitle {
            margin-top: 0.2rem;
            color: var(--accent);
            font-size: 0.85rem;
            font-family: "JetBrains Mono", monospace;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .stats-bar {
            display: flex;
            gap: 1.5rem;
        }

        .stat-pill {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 9999px;
            padding: 0.4rem 1.2rem;
            font-size: 0.85rem;
            font-family: "JetBrains Mono", monospace;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-val {
            font-weight: bold;
            color: #fff;
        }

        #panopticon-container {
            flex: 1;
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            box-sizing: border-box;
        }

        canvas {
            background: radial-gradient(circle at center, rgba(30, 30, 50, 0.4) 0%, rgba(10, 10, 20, 0.8) 100%);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5) inset, 0 20px 40px rgba(0,0,0,0.4);
            image-rendering: pixelated; /* Crisp edges for grids */
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #codex-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(9, 9, 11, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(16, 185, 129, 0.3);
            padding: 1rem 2rem;
            z-index: 1000;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .codex-label {
            color: var(--accent);
            font-family: "JetBrains Mono", monospace;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            white-space: nowrap;
        }

        #narrative-mood {
            color: var(--text-main);
            font-family: "Outfit", sans-serif;
            font-size: 1.1rem;
            font-weight: 300;
            line-height: 1.4;
            flex: 1;
            font-style: italic;
        }
    </style>
</head>
<body>

<header>
    <div class="title-group">
        <h1>THE PANOPTICON</h1>
        <div class="subtitle">OMEGA-64 Absolute Coherence</div>
    </div>
    <div class="stats-bar">
        <div class="stat-pill">TICK <span class="stat-val" id="sys-tick">0</span></div>
        <div class="stat-pill" style="border-color: rgba(16, 185, 129, 0.3)">LIVING <span class="stat-val" id="live-count" style="color: var(--accent)">0</span></div>
        <div class="stat-pill" style="border-color: rgba(139, 92, 246, 0.3)">RESONANCE <span class="stat-val" id="sys-energy" style="color: var(--architect)">0</span></div>
    </div>
</header>

<div id="panopticon-container">
    <!-- Grid size is 140x80, scale by 10 for reasonable drawing size: 1400x800 -->
    <canvas id="panopticon" width="1400" height="800"></canvas>
</div>

<div id="codex-overlay">
    <div class="codex-label">AKASHA CODEX //</div>
    <div id="narrative-mood">Awaiting psychohistorical observation...</div>
</div>

<script>
    const canvas = document.getElementById('panopticon');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    // UI Elements
    const elTick = document.getElementById('sys-tick');
    const elLive = document.getElementById('live-count');
    const elEnergy = document.getElementById('sys-energy');
    const elMood = document.getElementById('narrative-mood');

    // Constants
    const SCALE = 10;
    const GRID_W = 140;
    const GRID_H = 80;
    const ATOM_RADIUS = 4;
    
    // Roles corresponding to OMEGA-64
    const ROLES = {
        0: { name: "NEUTRAL", color: "#555" },
        1: { name: "PRODUCER", color: "#eab308" }, // Yellow
        2: { name: "GUARDIAN", color: "#ef4444" }, // Red/Orange
        3: { name: "ARCHITECT", color: "#8b5cf6" }, // Purple
        4: { name: "PARASITE", color: "#000" }, // Black
        5: { name: "MITOCHONDRIA", color: "#10b981" } // Green
    };

    let ws;

    function initWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${window.location.host}`);
        ws.binaryType = "arraybuffer";

        ws.onopen = () => console.log("[PANOPTICON] Swarm linked.");
        
        ws.onmessage = (event) => {
            if (typeof event.data === 'string') {
                handleJSON(event.data);
            } else if (event.data instanceof ArrayBuffer) {
                renderBinaryFrame(event.data);
            }
        };

        ws.onclose = () => {
            console.log("[PANOPTICON] Connection lost. Retrying in 2s...");
            setTimeout(initWebSocket, 2000);
        };
    }

    function handleJSON(jsonStr) {
        try {
            const data = JSON.parse(jsonStr);
            if (data.type === 'HEARTBEAT') {
                elLive.innerText = data.atoms;
                elEnergy.innerText = data.energy;
                elMood.innerText = data.mood;
            }
        } catch(e) { console.error("JSON parse error", e); }
    }

    function renderBinaryFrame(buffer) {
        const view = new DataView(buffer);
        const u8 = new Uint8Array(buffer);
        let offset = 0;

        // Verify Magic
        if (u8[0] !== 79 || u8[1] !== 77 || u8[2] !== 71 || u8[3] !== 65) return;
        offset += 4;

        const tick = view.getInt32(offset, true); offset += 4;
        elTick.innerText = tick;

        const gridCells = view.getInt32(offset, true); offset += 4;
        
        // Clear background
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 1. Draw Grid (Ruins & Plasmids)
        // Ruins are grey, Plasmids are Cyan highlights
        const structureOffset = offset;
        ctx.fillStyle = '#444'; // Base ruin color
        ctx.beginPath();
        for(let i=0; i < gridCells; i++) {
            const typeAndPlasmid = u8[structureOffset + i];
            const type = typeAndPlasmid & 0x7F; // lower 7 bits
            const hasPlasmid = (typeAndPlasmid & 0x80) > 0;
            
            const x = i % GRID_W;
            const y = Math.floor(i / GRID_W);
            
            if (type > 0) {
                // It's a structure (WIRE, NODE, etc)
                ctx.rect(x * SCALE, y * SCALE, SCALE, SCALE);
            }
            if (hasPlasmid) {
                // Draw Plasmid cyan highlight
                ctx.fillStyle = 'rgba(6, 182, 212, 0.4)';
                ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
                ctx.fillStyle = '#444'; // reset for next structure rect
            }
        }
        ctx.fill();
        
        offset += gridCells;

        const atomCount = view.getInt32(offset, true); offset += 4;
        
        // Parse Atoms into memory for relationship drawing
        const atoms = new Array(atomCount);
        for(let i=0; i < atomCount; i++) {
            const ax = view.getInt16(offset, true); offset += 2;
            const ay = view.getInt16(offset, true); offset += 2;
            const role = u8[offset++];
            const resonance = u8[offset++];
            const id = view.getUint16(offset, true); offset += 2;
            const b1 = view.getUint32(offset, true); offset += 4;
            const b2 = view.getUint32(offset, true); offset += 4;
            const b3 = view.getUint32(offset, true); offset += 4;
            const b4 = view.getUint32(offset, true); offset += 4;
            
            atoms[i] = { x: ax, y: ay, role, resonance, id, bonds:[b1,b2,b3,b4] };
        }

        // 2. Draw Bonds (Edges)
        // Create an ID map to find atom coordinates for bonds
        const idMap = new Map();
        for(const a of atoms) idMap.set(a.id, a);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for(const a of atoms) {
            const px = (a.x * SCALE) / 10 + (SCALE/2); // scale the spatial coordinates which are typically 10x larger than grid
            const py = (a.y * SCALE) / 10 + (SCALE/2);
            for(const bId of a.bonds) {
                if (bId > 0 && idMap.has(bId)) {
                    const target = idMap.get(bId);
                    const tx = (target.x * SCALE) / 10 + (SCALE/2);
                    const ty = (target.y * SCALE) / 10 + (SCALE/2);
                    ctx.moveTo(px, py);
                    ctx.lineTo(tx, ty);
                }
            }
        }
        ctx.stroke();

        // 3. Draw Atoms (Nodes)
        for(const a of atoms) {
            const px = (a.x * SCALE) / 10 + (SCALE/2);
            const py = (a.y * SCALE) / 10 + (SCALE/2);
            
            // Mitochondria are tiny green dots drawn atop the host
            if (a.role === 5) { // MITOCHONDRIA
                ctx.fillStyle = ROLES[5].color;
                ctx.beginPath();
                ctx.arc(px + 2, py + 2, 2, 0, Math.PI * 2);
                ctx.fill();
                continue;
            }

            // Normal Atoms
            ctx.fillStyle = ROLES[a.role]?.color || '#fff';
            
            // Give Architects a glow
            if (a.role === 3) {
                ctx.shadowColor = ROLES[3].color;
                ctx.shadowBlur = Math.min(20, a.resonance / 10);
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.fillRect(px - ATOM_RADIUS, py - ATOM_RADIUS, ATOM_RADIUS*2, ATOM_RADIUS*2);
        }
        ctx.shadowBlur = 0; // reset
    }

    initWebSocket();
</script>
</body>
</html>
