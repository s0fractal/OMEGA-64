<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Σ-CORE Panopticon</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: sans-serif;
      }
      canvas {
        display: block;
      }
      #hud {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #fff;
        z-index: 10;
        text-shadow: 1px 1px 2px #000;
        pointer-events: none;
      }
    </style>
    <!-- Native Import Map for ES Modules -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <div>ATOMS [LIVE]: <span id="stat-atoms">0</span></div>
      <div>CORE ENERGY: <span id="stat-energy">0.0</span> Ω</div>
      <div style="margin-top: 10px; max-width: 400px; font-style: italic; opacity: 0.8" id="stat-mood"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
