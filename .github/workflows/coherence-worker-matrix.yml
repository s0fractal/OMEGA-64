name: coherence-worker-matrix

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coherence-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: worker-${{ matrix.worker_count }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        worker_count: [1, 4]
    env:
      OMEGA_PULSE_WORKERS: ${{ matrix.worker_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify WASM layout
        run: deno task wasm:layout

      - name: Verify coherence deep
        run: deno task verify:coherence:deep

      - name: Build resilience audit artifact
        if: matrix.worker_count == 4
        run: deno task test:worker-resilience-trend && deno task test:worker-soak-stability

      - name: Upload audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.worker_count }}-audits
          path: |
            WORKER_DRIFT_AUDIT.md
            WORKER_DRIFT_AUDIT.json
            WORKER_RESILIENCE_AUDIT.json
            WORKER_RESILIENCE_BUDGET.json
            WORKER_RESILIENCE_BUDGET.md
            WORKER_RESILIENCE_TREND.json
            WORKER_RESILIENCE_TREND.md
            WORKER_SOAK_STABILITY.json
            WORKER_SOAK_STABILITY.md
          if-no-files-found: ignore
