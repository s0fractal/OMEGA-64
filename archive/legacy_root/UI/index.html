<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEGA-64 | Sovereign UI</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
      <div id="overlay">
        <header>
          <h1>OMEGA-64</h1>
          <p class="subtitle">Triple-Spine Visualizer (Rescued)</p>
        </header>
        <div id="metadata" class="glass">
          <div class="level-info">
            <span class="label">TRANSITION:</span>
            <span id="level-display">L63 → L00</span>
          </div>
          <div class="health-info">
            <span class="label">O-HEALTH:</span>
            <span id="health-signal" class="health-signal">UNKNOWN</span>
          </div>
          <div class="health-detail">
            <span class="label">SAFE WINDOW:</span>
            <span id="safe-window" class="health-signal">UNKNOWN</span>
          </div>
          <div class="health-detail">
            <span class="label">O-COUNT:</span>
            <span id="health-count">0</span>
          </div>
          <div class="health-detail">
            <span class="label">INDEX:</span>
            <span id="health-index">UNKNOWN</span>
          </div>
          <div class="health-detail">
            <span class="label">UPDATED:</span>
            <span id="health-updated">--:--:--</span>
          </div>
          <div class="health-detail">
            <span class="label">MOUNTS:</span>
            <span id="mount-count">0</span>
          </div>
          <div class="health-detail">
            <span class="label">MOUNT FILES:</span>
            <span id="mount-files">0</span>
          </div>
          <div class="resonance-gauge">
            <div id="gauge-bar"></div>
          </div>
        </div>
        <footer>
          <p>🛡️⚖️🌀🛡️ SYMBOLIC RESONANCE ACTIVE</p>
        </footer>
      </div>
    </div>
    <script type="module" src="main.ts"></script>
  </body>
</html>
