<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEGA-64 | Petri Dish Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    >
    <style>
      :root {
        --bg-dark: #09090b;
        --glass-bg: rgba(24, 24, 27, 0.4);
        --glass-border: rgba(255, 255, 255, 0.08);
        --text-main: #f4f4f5;
        --text-dim: #a1a1aa;
        --accent: #10b981;
        --accent-glow: rgba(16, 185, 129, 0.2);
        --danger: #ef4444;
        --danger-glow: rgba(239, 68, 68, 0.2);
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: "Outfit", sans-serif;
        background-image:
          radial-gradient(
            circle at 15% 50%,
            rgba(20, 20, 30, 0.8),
            transparent 25%
          ),
          radial-gradient(
          circle at 85% 30%,
          rgba(20, 30, 20, 0.6),
          transparent 25%
        );
        background-attachment: fixed;
        min-height: 100vh;
      }

      header {
        padding: 2rem;
        text-align: center;
        border-bottom: 1px solid var(--glass-border);
        background: linear-gradient(
          180deg,
          rgba(9, 9, 11, 0.9) 0%,
          rgba(9, 9, 11, 0.4) 100%
        );
        backdrop-filter: blur(12px);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      h1 {
        margin: 0;
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: -0.05em;
        background: linear-gradient(to right, #fff, #a1a1aa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .subtitle {
        margin-top: 0.5rem;
        color: var(--text-dim);
        font-size: 1rem;
        font-weight: 300;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .stats-bar {
        display: flex;
        justify-content: center;
        gap: 2rem;
        margin-top: 1.5rem;
      }

      .stat-pill {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 9999px;
        padding: 0.5rem 1.5rem;
        font-size: 0.9rem;
        font-family: "JetBrains Mono", monospace;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }

      .stat-val {
        font-weight: bold;
        color: #fff;
      }

      .arena-container {
        position: relative;
        width: 100%;
        height: 800px;
        margin: 20px auto;
        background: radial-gradient(circle at center, rgba(30, 30, 50, 0.4) 0%, rgba(10, 10, 20, 0.8) 100%);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        overflow: hidden;
      }

      .atom-card {
        position: absolute;
        transform: translate(-50%, -50%); /* Centered on X,Y */
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        backdrop-filter: blur(16px);
        transition: left 0.5s ease-out, top 0.5s ease-out, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .atom-card:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .atom-card.status-dust {
        opacity: 0.5;
        filter: grayscale(100%);
      }

      .atom-card.status-dust:hover {
        transform: none;
        box-shadow: none;
        border-color: var(--glass-border);
      }

      .atom-card.retro-linked {
        border-color: rgba(249, 115, 22, 0.4);
        box-shadow: 0 0 20px rgba(249, 115, 22, 0.1) inset;
      }

      .atom-card.status-alpha {
        border-color: rgba(255, 215, 0, 0.6);
        box-shadow: 0 0 40px rgba(255, 215, 0, 0.3), inset 0 0 20px rgba(255, 215, 0, 0.2);
        animation: alpha-pulse 4s infinite ease-in-out;
      }

      @keyframes alpha-pulse {
        0%, 100% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.3), inset 0 0 20px rgba(255, 215, 0, 0.2); }
        50% { box-shadow: 0 0 60px rgba(255, 215, 0, 0.5), inset 0 0 30px rgba(255, 215, 0, 0.4); }
      }

      .thought-hud {
        position: absolute;
        top: -30px;
        background: rgba(0, 0, 0, 0.8);
        border: 1px solid var(--accent);
        color: var(--accent);
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: 4px;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0.8;
        box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        z-index: 10;
      }

      .svg-container {
        width: 200px;
        height: 200px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 1.5rem;
        filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.05));
      }

      .svg-container svg {
        width: 100%;
        height: 100%;
      }

      .meta {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .retro-badge {
        font-size: 0.65rem;
        color: rgba(255, 255, 255, 0.7);
        letter-spacing: 1px;
        background: rgba(249, 115, 22, 0.1);
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid rgba(249, 115, 22, 0.3);
        text-align: center;
        margin-top: -0.25rem;
        word-break: break-all;
      }

      .symbol {
        font-size: 1.25rem;
        font-weight: 600;
        text-align: center;
        letter-spacing: 0.05em;
        margin: 0;
      }

      .eigenvalue {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
        color: var(--text-dim);
        text-align: center;
        background: rgba(0, 0, 0, 0.3);
        padding: 0.25rem 0.5rem;
        border-radius: 6px;
        margin: 0;
      }

      .energy-bar-container {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        overflow: hidden;
        margin-top: 0.5rem;
      }

      .energy-bar {
        height: 100%;
        border-radius: 3px;
        transition: width 0.5s ease-out, background-color 0.5s ease;
      }

      .energy-text {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.75rem;
        color: var(--text-dim);
        text-align: right;
        margin-top: -0.25rem;
      }

      /* Ambient glowing pulses for active atoms */
      @keyframes pulse-glow {
        0% {
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0) inset;
        }
        50% {
          box-shadow: 0 0 40px 0 rgba(16, 185, 129, 0.05) inset;
        }
        100% {
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0) inset;
        }
      }

      .atom-card.status-alive {
        animation: pulse-glow 4s infinite ease-in-out;
      }

      .akashic-ticker {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(9, 9, 11, 0.95);
        border-top: 1px solid rgba(16, 185, 129, 0.3);
        backdrop-filter: blur(10px);
        padding: 0.75rem 2rem;
        display: flex;
        gap: 2rem;
        overflow-x: auto;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
        white-space: nowrap;
        z-index: 1000;
        scroll-behavior: smooth;
        color: var(--accent);
      }
      .akashic-ticker span {
        border-right: 1px solid var(--glass-border);
        padding-right: 2rem;
      }
      .akashic-ticker span:last-child {
        border-right: none;
      }
      body { padding-bottom: 50px; } /* Room for ticker */

      .forge-panel {
          margin: 1rem 2rem;
          padding: 1rem;
          background: rgba(10, 15, 30, 0.8);
          border: 1px solid var(--glass-border);
          border-radius: 8px;
          display: flex;
          gap: 1rem;
          align-items: center;
          flex-wrap: wrap;
      }
      .forge-panel input {
          background: rgba(0, 0, 0, 0.5);
          border: 1px solid var(--glass-border);
          color: #fff;
          padding: 0.5rem;
          border-radius: 4px;
          font-family: monospace;
          outline: none;
      }
      .forge-panel input:focus {
          border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PETRI DISH // OMEGA-64</h1>
      <div class="subtitle">Live Flatland Telemetry</div>
      <button class="pulse-button" id="zero-iops-btn" style="margin-top: 10px; padding: 6px 16px; font-size: 0.8rem;">
          <span>🌀 EXECUTE ZERO-IOPS PULSE</span>
      </button>

      <div class="stats-bar">
        <div class="stat-pill">
          TOTAL ATOMS: <span class="stat-val" id="total-count">0</span>
        </div>
        <div class="stat-pill" style="border-color: rgba(16, 185, 129, 0.3)">
          LIVING: <span
            class="stat-val"
            id="live-count"
            style="color: var(--accent)"
          >0</span>
        </div>
        <div class="stat-pill" style="border-color: rgba(239, 68, 68, 0.3)">
          DUST: <span
            class="stat-val"
            id="dust-count"
            style="color: var(--danger)"
          >0</span>
        </div>
        <div class="stat-pill">
          SYS. ENERGY: <span class="stat-val" id="sys-energy">0</span>
        </div>
      </div>
    </header>

    <div class="forge-panel">
        <span style="color: var(--accent); font-weight: bold;">⚒️ NOOSPHERIC FORGE</span>
        <input type="text" id="forge-symbol" placeholder="SYMBOL (e.g. SPARK)" value="SPARK" />
        <input type="text" id="forge-logic" placeholder="LOGIC HEX (e.g. 88880000)" value="88880000" maxlength="8" />
        <input type="number" id="forge-energy" placeholder="ENERGY" value="100" style="width: 80px;" />
        <button class="pulse-button" id="forge-btn" style="padding: 0.5rem 1rem; width: auto; font-size: 0.8rem;">
            <span>SYNTHESIZE ATOM</span>
        </button>
    </div>

    <div class="arena-container" id="arena">
      <svg id="mycelial-layer" width="100%" height="100%"></svg>
      <!-- Atoms injected here via JS -->
    </div>

    <div class="akashic-ticker" id="akasha-log">
      <span>[AKASHA] Awaiting telemetry...</span>
    </div>

    <script>
      const arena = document.getElementById("arena");
      const elements = {
        total: document.getElementById("total-count"),
        live: document.getElementById("live-count"),
        dust: document.getElementById("dust-count"),
        energy: document.getElementById("sys-energy"),
      };

      // Track existing atoms in DOM to update instead of re-rendering completely
      // to prevent SVG animation resets if the code didn't change
      let atomNodes = new Map();

      function getEnergyColor(energy) {
        if (energy >= 140) return "#8b5cf6"; // Fission ready (purple)
        if (energy >= 100) return "#10b981"; // Healthy (green)
        if (energy >= 50) return "#eab308"; // Warning (yellow)
        return "#ef4444"; // Starving (red)
      }

      async function fetchAtoms() {
        try {
          const response = await fetch("/api/atoms");
          const atoms = await response.json();

          let liveCnt = 0;
          let dustCnt = 0;
          let totalEnergy = 0;

          // Create a Set of current atom filenames fetched
          const fetchedFilenames = new Set(
            atoms.map((a) => a.filename),
          );

          // 1. Remove nodes that no longer exist (e.g. consumed dust, old names)
          for (const [filename, node] of atomNodes.entries()) {
            if (!fetchedFilenames.has(filename)) {
              node.remove();
              atomNodes.delete(filename);
            }
          }

          // 2. Add or update nodes
          atoms.forEach((atom) => {
            totalEnergy += atom.energy;
            if (atom.isDust || atom.energy <= 0) {
              dustCnt++;
            } else {
              liveCnt++;
            }

            const isAlive = !atom.isDust && atom.energy > 0;
            const ePct = Math.min(
              Math.max((atom.energy / 150) * 100, 0),
              100,
            );
            const eColor = getEnergyColor(atom.energy);

            let card = atomNodes.get(atom.filename);

            if (!card) {
              // Create new card
              card = document.createElement("div");
              card.className = `atom-card ${
                isAlive ? "status-alive" : "status-dust"
              } ${atom.retroEigen ? "retro-linked" : ""} ${atom.symbol.startsWith("ALPHA_") ? "status-alpha" : ""}`;
              card.setAttribute("data-filename", atom.filename);
              card.style.cursor = "pointer";
              card.style.left = `${atom.x}px`;
              card.style.top = `${atom.y}px`;

              card.innerHTML = `
                            <div class="thought-hud">${atom.thought}</div>
                            <div class="svg-container">${
                atom.svg ||
                '<div style="color: #444; font-family: monospace;">[NO SVG]</div>'
              }</div>
                            <div class="meta">
                                <h3 class="symbol">${atom.symbol}</h3>
                                ${atom.retroEigen ? `<div class="retro-badge"><strong style="color:var(--accent)">FUTURE-LINK:</strong> _${atom.retroEigen}</div>` : ''}
                                <div class="eigenvalue">${
                atom.eigenvalue.length > 18 ? 
                  atom.eigenvalue.substring(0,18) + '<br/>_' + atom.eigenvalue.substring(19) : 
                  atom.eigenvalue.substring(0, 18)
              }</div>
                                <div class="energy-bar-container">
                                    <div class="energy-bar" style="width: ${ePct}%; background-color: ${eColor};"></div>
                                </div>
                                <div class="energy-text">${
                Math.floor(atom.energy)
              } NRG</div>
                            </div>
                        `;

              arena.appendChild(card);
              atomNodes.set(atom.filename, card);
            } else {
              // Update existing card data
              card.className = `atom-card ${
                isAlive ? "status-alive" : "status-dust"
              } ${atom.symbol.startsWith("ALPHA_") ? "status-alpha" : ""}`;

              // We only update the SVG if the eigenvalue changed (which implies file renamed, so new card usually, but just in case)
              // The energy block is what needs frequent updating
              const eBar = card.querySelector(".energy-bar");
               const eText = card.querySelector(".energy-text");
               const thoughtHud = card.querySelector(".thought-hud");
               if (thoughtHud) thoughtHud.innerText = atom.thought;

               eBar.style.width = `${ePct}%`;
              eBar.style.backgroundColor = eColor;
              eText.innerText = `${Math.floor(atom.energy)} NRG`;
              
              // Apply physical position
              card.style.left = `${atom.x}px`;
              card.style.top = `${atom.y}px`;
            }
          });

          // Update stats
          elements.total.innerText = atoms.length;
          elements.live.innerText = liveCnt;
          elements.dust.innerText = dustCnt;
          elements.energy.innerText = Math.floor(totalEnergy);
          // --------------------------------------------------------------------------
          // --- MYCELIAL NETWORK RENDERER ---
          // Draw the synaptic bonds between atoms
          const mycelium = document.getElementById("mycelial-layer");
          mycelium.innerHTML = ""; // Clear old lines
          
          atoms.forEach(atom => {
             if (atom.bonds && atom.bonds.length > 0) {
                 atom.bonds.forEach(bondedEigen => {
                     // Find the partner
                     const partner = atoms.find(a => a.filename.includes(bondedEigen));
                     if (partner) {
                         // Draw line
                         const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                         line.setAttribute("x1", atom.x);
                         line.setAttribute("y1", atom.y);
                         line.setAttribute("x2", partner.x);
                         line.setAttribute("y2", partner.y);
                         
                         const dist = Math.hypot(partner.x-atom.x, partner.y-atom.y);
                         
                         // Style line: Thicker = more energy, Brighter = closer
                         line.setAttribute("stroke", "rgba(16, 185, 129, 0.4)");
                         line.setAttribute("stroke-width", Math.min(dist / 20, 3));
                         line.style.transition = "all 0.5s ease-out";
                         
                         mycelium.appendChild(line);
                     }
                 });
             }
          });
          // --------------------------------------------------------------------------

        } catch (error) {
          console.error("Failed to fetch atoms:", error);
        }
      }

      // Hand of God Interactions
      arena.addEventListener("click", async (e) => {
        const card = e.target.closest(".atom-card");
        if (!card) return;
        const filename = card.getAttribute("data-filename");
        
        if (e.shiftKey) {
            // BLESS
            card.style.transform = "scale(1.2)";
            card.style.boxShadow = "inset 0 0 50px rgba(16, 185, 129, 0.8), 0 0 50px rgba(16, 185, 129, 0.8)";
            setTimeout(() => {
                card.style.transform = "";
                card.style.boxShadow = "";
            }, 300);
            await fetch(`/api/bless/${encodeURIComponent(filename)}`, { method: "POST" });
        } else {
            // FEED
            card.style.transform = "scale(1.1)";
            card.style.boxShadow = "inset 0 0 30px rgba(255, 255, 255, 0.5)";
            setTimeout(() => {
                card.style.transform = "";
                card.style.boxShadow = "";
            }, 200);
            await fetch(`/api/feed/${encodeURIComponent(filename)}`, { method: "POST" });
        }
        
        fetchAtoms();
      });

      arena.addEventListener("contextmenu", async (e) => {
        e.preventDefault();
        const card = e.target.closest(".atom-card");
        if (!card) return;
        const filename = card.getAttribute("data-filename");
        
        card.style.transform = "scale(0.9)";
        card.style.boxShadow = "inset 0 0 40px rgba(239,68,68,0.6)";
        setTimeout(() => {
            card.style.transform = "";
            card.style.boxShadow = "";
        }, 200);

        await fetch(`/api/zap/${encodeURIComponent(filename)}`, { method: "POST" });
        fetchAtoms();
      });

      // Fetch Akasha Logs
      async function fetchAkasha() {
        try {
            const res = await fetch("/api/akasha");
            const data = await res.json();
            const ticker = document.getElementById("akasha-log");
            if (data.logs && data.logs.length > 0) {
                ticker.innerHTML = data.logs.map((log) => `<span>${log}</span>`).join("");
                ticker.scrollLeft = ticker.scrollWidth;
            }
        } catch { }
      }

      // Zero-IOPS Execution
      const zeroIopsBtn = document.getElementById("zero-iops-btn");
      zeroIopsBtn.addEventListener("click", async () => {
          zeroIopsBtn.style.transform = "scale(0.95)";
          zeroIopsBtn.style.boxShadow = "0 0 40px rgba(100, 100, 255, 0.8)";
          
          try {
              await fetch("/api/zero-iops", { method: "POST" });
              fetchAtoms();
          } catch (e) {}

          setTimeout(() => {
              zeroIopsBtn.style.transform = "";
              zeroIopsBtn.style.boxShadow = "";
          }, 500);
      });

      // Noospheric Forge Execution
      const forgeBtn = document.getElementById("forge-btn");
      forgeBtn.addEventListener("click", async () => {
          const symbol = document.getElementById("forge-symbol").value;
          const logic = document.getElementById("forge-logic").value;
          const energy = document.getElementById("forge-energy").value;

          forgeBtn.style.transform = "scale(0.95)";
          forgeBtn.innerText = "SYNTHESIZING...";

          try {
              await fetch("/api/forge", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ symbol, logic, energy })
              });
              fetchAtoms();
          } catch (e) {}

          setTimeout(() => {
              forgeBtn.style.transform = "";
              forgeBtn.innerText = "SYNTHESIZE ATOM";
          }, 500);
      });

      // Fetch immediately, then poll
      fetchAtoms();
      fetchAkasha();
      setInterval(fetchAtoms, 1000);
      setInterval(fetchAkasha, 2000);
    </script>
  </body>
</html>
