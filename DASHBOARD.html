<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEGA-64 | Petri Dish Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    >
    <style>
      :root {
        --bg-dark: #09090b;
        --glass-bg: rgba(24, 24, 27, 0.4);
        --glass-border: rgba(255, 255, 255, 0.08);
        --text-main: #f4f4f5;
        --text-dim: #a1a1aa;
        --accent: #10b981;
        --accent-glow: rgba(16, 185, 129, 0.2);
        --danger: #ef4444;
        --danger-glow: rgba(239, 68, 68, 0.2);
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: "Outfit", sans-serif;
        background-image:
          radial-gradient(
            circle at 15% 50%,
            rgba(20, 20, 30, 0.8),
            transparent 25%
          ),
          radial-gradient(
          circle at 85% 30%,
          rgba(20, 30, 20, 0.6),
          transparent 25%
        );
        background-attachment: fixed;
        min-height: 100vh;
        overflow-x: hidden;
        transition: background-color 2s ease;
      }

      #mood-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: -1;
        opacity: 0.15;
        transition: background 3s ease;
      }

      header {
        padding: 2rem;
        text-align: center;
        border-bottom: 1px solid var(--glass-border);
        background: linear-gradient(
          180deg,
          rgba(9, 9, 11, 0.9) 0%,
          rgba(9, 9, 11, 0.4) 100%
        );
        backdrop-filter: blur(12px);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      h1 {
        margin: 0;
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: -0.05em;
        background: linear-gradient(to right, #fff, #a1a1aa);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .subtitle {
        margin-top: 0.5rem;
        color: var(--text-dim);
        font-size: 1rem;
        font-weight: 300;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .stats-bar {
        display: flex;
        justify-content: center;
        gap: 2rem;
        margin-top: 1.5rem;
      }

      .stat-pill {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 9999px;
        padding: 0.5rem 1.5rem;
        font-size: 0.9rem;
        font-family: "JetBrains Mono", monospace;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }

      .stat-val {
        font-weight: bold;
        color: #fff;
      }

      /* --- SOVEREIGNTY HUD --- */
      .sovereignty-hud {
        display: flex;
        justify-content: center;
        gap: 2rem;
        margin-top: 1rem;
        padding: 0.8rem;
        background: rgba(16, 185, 129, 0.05);
        border: 1px solid rgba(16, 185, 129, 0.2);
        border-radius: 12px;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.85rem;
        backdrop-filter: blur(8px);
        transition: all 0.3s ease;
      }
      .sovereignty-hud.active {
        background: rgba(16, 185, 129, 0.1);
        border-color: rgba(16, 185, 129, 0.5);
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
      }
      .sov-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .sovereignty-hud .label {
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
      }
      .sovereignty-hud .val {
        font-weight: 700;
        color: #fff;
      }

      /* --- STORY TICKER --- */
      #story-ticker-container {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(9, 9, 11, 0.9);
        backdrop-filter: blur(20px);
        border-top: 1px solid var(--glass-border);
        padding: 0.75rem 0;
        z-index: 1000;
        overflow: hidden;
        display: none;
      }

      #story-ticker {
        display: flex;
        white-space: nowrap;
        animation: ticker 60s linear infinite;
        font-family: "JetBrains Mono", monospace;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.2em;
      }

      @keyframes ticker {
        0% {
          transform: translateX(100%);
        }
        100% {
          transform: translateX(-100%);
        }
      }

      .ticker-word {
        padding: 0 2rem;
        border-right: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .ticker-origin {
        font-size: 0.7rem;
        opacity: 0.4;
        font-weight: 400;
      }
      .sov-val {
        color: var(--accent);
        font-weight: bold;
        text-shadow: 0 0 10px var(--accent-glow);
      }
      .sov-val.none {
        color: var(--text-dim);
        text-shadow: none;
      }

      .arena-container {
        position: relative;
        width: 100%;
        height: 800px;
        margin: 20px auto;
        background: radial-gradient(
          circle at center,
          rgba(30, 30, 50, 0.4) 0%,
          rgba(10, 10, 20, 0.8) 100%
        );
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        overflow: hidden;
      }

      .atom-card {
        position: absolute;
        transform: translate(-50%, -50%); /* Centered on X,Y */
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        backdrop-filter: blur(16px);
        transition:
          left 0.5s ease-out,
          top 0.5s ease-out,
          transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .atom-card:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .atom-card.status-dust {
        opacity: 0.5;
        filter: grayscale(100%);
      }

      .atom-card.status-dust:hover {
        transform: none;
        box-shadow: none;
        border-color: var(--glass-border);
      }

      .atom-card.retro-linked {
        border-color: rgba(249, 115, 22, 0.4);
        box-shadow: 0 0 20px rgba(249, 115, 22, 0.1) inset;
      }

      .atom-card.status-alpha {
        border-color: rgba(255, 215, 0, 0.6);
        box-shadow:
          0 0 40px rgba(255, 215, 0, 0.3),
          inset 0 0 20px rgba(255, 215, 0, 0.2);
        animation: alpha-pulse 4s infinite ease-in-out;
      }

      @keyframes alpha-pulse {
        0%, 100% {
          box-shadow:
            0 0 40px rgba(255, 215, 0, 0.3),
            inset 0 0 20px rgba(255, 215, 0, 0.2);
        }
        50% {
          box-shadow:
            0 0 60px rgba(255, 215, 0, 0.5),
            inset 0 0 30px rgba(255, 215, 0, 0.4);
        }
      }

      .thought-hud {
        position: absolute;
        top: -30px;
        background: rgba(0, 0, 0, 0.8);
        border: 1px solid var(--accent);
        color: var(--accent);
        font-family: "JetBrains Mono", monospace;
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: 4px;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0.8;
        box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        z-index: 10;
      }

      .svg-container {
        width: 200px;
        height: 200px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 1.5rem;
        filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.05));
      }

      .svg-container svg {
        width: 100%;
        height: 100%;
      }

      .meta {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .thought-hud {
        position: absolute;
        top: -30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: var(--accent);
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 0.8rem;
        font-weight: bold;
        white-space: nowrap;
        pointer-events: none;
        border: 1px solid var(--accent);
        opacity: 0.9;
        z-index: 10;
        box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        letter-spacing: 1px;
      }

      .retro-badge {
        font-size: 0.65rem;
        color: rgba(255, 255, 255, 0.7);
        letter-spacing: 1px;
        background: rgba(249, 115, 22, 0.1);
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid rgba(249, 115, 22, 0.3);
        text-align: center;
        margin-top: -0.25rem;
        word-break: break-all;
      }

      .symbol {
        font-size: 1.25rem;
        font-weight: 600;
        text-align: center;
        letter-spacing: 0.05em;
        margin: 0;
      }

      .eigenvalue {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
        color: var(--text-dim);
        text-align: center;
        background: rgba(0, 0, 0, 0.3);
        padding: 0.25rem 0.5rem;
        border-radius: 6px;
        margin: 0;
      }

      .energy-bar-container {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        overflow: hidden;
        margin-top: 0.5rem;
      }

      .energy-bar {
        height: 100%;
        border-radius: 3px;
        transition: width 0.5s ease-out, background-color 0.5s ease;
      }

      .energy-text {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.75rem;
        color: var(--text-dim);
        text-align: right;
        margin-top: -0.25rem;
      }

      /* Ambient glowing pulses for active atoms */
      @keyframes pulse-glow {
        0% {
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0) inset;
        }
        50% {
          box-shadow: 0 0 40px 0 rgba(16, 185, 129, 0.05) inset;
        }
        100% {
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0) inset;
        }
      }

      .atom-card.status-alive {
        animation: pulse-glow 4s infinite ease-in-out;
      }

      .atom-card.status-pulsing {
        box-shadow: 0 0 50px #fff, inset 0 0 20px #fff !important;
        border-color: #fff !important;
        transition: all 0.1s ease-out;
      }

      .resonance-aura {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 1px solid rgba(16, 185, 129, 0.3);
        animation: aura-expand 2s infinite ease-out;
        pointer-events: none;
        z-index: -1;
        transition: transform 0.5s ease-out, opacity 0.5s ease-out;
      }

      /* CASTE SPECIFIC STYLING */
      .atom-card.caste-WORKER {
        border-color: rgba(6, 182, 212, 0.5);
        background: rgba(8, 145, 178, 0.05);
      }
      .atom-card.caste-WORKER .symbol {
        color: #06b6d4;
      }

      .atom-card.caste-GUARDIAN {
        border-color: rgba(249, 115, 22, 0.5);
        background: rgba(194, 65, 12, 0.05);
      }
      .atom-card.caste-GUARDIAN .symbol {
        color: #f97316;
      }

      .atom-card.caste-ARCHIVIST {
        border-color: rgba(168, 85, 247, 0.5);
        background: rgba(126, 34, 206, 0.05);
      }
      .atom-card.caste-ARCHIVIST .symbol {
        color: #a855f7;
      }

      .atom-card.caste-NUCLEUS {
        border-color: #fff;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      }
      .atom-card.caste-NUCLEUS .symbol {
        color: #fff;
        text-shadow: 0 0 10px #fff;
      }

      .atom-card.caste-PARASITE {
        border-color: #ef4444;
        background: rgba(153, 27, 27, 0.1);
      }
      .atom-card.caste-PARASITE .symbol {
        color: #ef4444;
      }

      .caste-badge {
        font-family: "Inter", sans-serif;
        font-size: 0.6rem;
        font-weight: 800;
        text-transform: uppercase;
        padding: 2px 6px;
        border-radius: 4px;
        position: absolute;
        top: 8px;
        right: 8px;
        letter-spacing: 1px;
      }
      .caste-WORKER .caste-badge {
        background: rgba(6, 182, 212, 0.2);
        color: #22d3ee;
      }
      .caste-GUARDIAN .caste-badge {
        background: rgba(249, 115, 22, 0.2);
        color: #fb923c;
      }
      .caste-ARCHIVIST .caste-badge {
        background: rgba(168, 85, 247, 0.2);
        color: #c084fc;
      }
      .caste-NUCLEUS .caste-badge {
        background: #fff;
        color: #000;
        box-shadow: 0 0 10px #fff;
      }
      .caste-PARASITE .caste-badge {
        background: #ef4444;
        color: #fff;
      }

      .signal-dot {
        filter: blur(2px);
        animation: move-signal 0.5s linear forwards;
      }

      @keyframes aura-expand {
        0% {
          transform: scale(1);
          opacity: 0.8;
        }
        100% {
          transform: scale(3);
          opacity: 0;
        }
      }

      @keyframes move-signal {
        from {
          offset-distance: 0%;
        }
        to {
          offset-distance: 100%;
        }
      }

      .akashic-ticker {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(9, 9, 11, 0.95);
        border-top: 1px solid rgba(16, 185, 129, 0.3);
        backdrop-filter: blur(10px);
        padding: 0.75rem 2rem;
        display: flex;
        gap: 2rem;
        overflow-x: auto;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
        white-space: nowrap;
        z-index: 1000;
        scroll-behavior: smooth;
        color: var(--accent);
      }
      .akashic-ticker span {
        border-right: 1px solid var(--glass-border);
        padding-right: 2rem;
      }
      .akashic-ticker span:last-child {
        border-right: none;
      }
      body {
        padding-bottom: 50px;
      } /* Room for ticker */

      .forge-panel {
        margin: 1rem 2rem;
        padding: 1rem;
        background: rgba(10, 15, 30, 0.8);
        border: 1px solid var(--glass-border);
        border-radius: 8px;
        display: flex;
        gap: 1rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .forge-panel input {
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid var(--glass-border);
        color: #fff;
        padding: 0.5rem;
        border-radius: 4px;
        font-family: monospace;
        outline: none;
      }
      .forge-panel input:focus {
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PETRI DISH // OMEGA-64</h1>
      <div class="subtitle">Live Flatland Telemetry</div>
      <button
        class="pulse-button"
        id="zero-iops-btn"
        style="margin-top: 10px; padding: 6px 16px; font-size: 0.8rem"
      >
        <span>🌀 TRANSMUTE (Zero-IOPS)</span>
      </button>

      <div class="stats-bar">
        <div class="stat-pill">
          TOTAL ATOMS: <span class="stat-val" id="total-count">0</span>
        </div>
        <div class="stat-pill" style="border-color: rgba(16, 185, 129, 0.3)">
          LIVING: <span
            class="stat-val"
            id="live-count"
            style="color: var(--accent)"
          >0</span>
        </div>
        <div class="stat-pill" style="border-color: rgba(239, 68, 68, 0.3)">
          DUST: <span
            class="stat-val"
            id="dust-count"
            style="color: var(--danger)"
          >0</span>
        </div>
        <div class="stat-pill">
          SYS. ENERGY: <span class="stat-val" id="sys-energy">0</span>
        </div>
      </div>

      <div class="sovereignty-hud" id="sovereignty-hud">
        <span class="label">Regent:</span> <span class="val" id="regent-val"
        >NONE</span>
        <span class="label">Law:</span> <span class="val" id="decree-val"
        >DEMOCRACY</span>
        <span class="label">Legitimacy:</span> <span
          class="val"
          id="legitimacy-val"
        >0</span>
      </div>

      <div id="mood-overlay"></div>

      <div id="story-ticker-container">
        <div id="story-ticker"></div>
      </div>
    </header>

    <div class="forge-panel">
      <span style="color: var(--accent); font-weight: bold"
      >⚒️ NOOSPHERIC FORGE</span>
      <input
        type="text"
        id="forge-symbol"
        placeholder="SYMBOL (e.g. SPARK)"
        value="SPARK"
        title="The name of the species"
      />
      <input
        type="text"
        id="forge-word"
        placeholder="WORD (e.g. LIFE)"
        title="Hash natural language into DNA"
      />
      <span style="color: var(--text-dim)">OR</span>
      <input
        type="text"
        id="forge-logic"
        placeholder="HEX DNA"
        value="88880000"
        maxlength="8"
        style="width: 100px"
        title="Specific 8-hex DNA sequence"
      />
      <input
        type="number"
        id="forge-energy"
        placeholder="NRG"
        value="100"
        style="width: 60px"
      />
      <button
        class="pulse-button"
        id="forge-btn"
        style="padding: 0.5rem 1rem; width: auto; font-size: 0.8rem"
      >
        <span>SYNTHESIZE ATOM</span>
      </button>
    </div>

    <div class="arena-container" id="arena">
      <svg id="mycelial-layer" width="100%" height="100%"></svg>
      <!-- Atoms injected here via JS -->
    </div>

    <div class="akashic-ticker" id="akasha-log">
      <span>[AKASHA] Awaiting telemetry...</span>
    </div>

    <script>
      const arena = document.getElementById("arena");
      const elements = {
        total: document.getElementById("total-count"),
        live: document.getElementById("live-count"),
        dust: document.getElementById("dust-count"),
        energy: document.getElementById("sys-energy"),
      };

      // Track existing atoms in DOM to update instead of re-rendering completely
      // to prevent SVG animation resets if the code didn't change
      let atomNodes = new Map();

      function getEnergyColor(energy) {
        if (energy >= 140) return "#8b5cf6"; // Fission ready (purple)
        if (energy >= 100) return "#10b981"; // Healthy (green)
        if (energy >= 50) return "#eab308"; // Warning (yellow)
        return "#ef4444"; // Starving (red)
      }

      async function fetchAtoms() {
        try {
          const response = await fetch("/api/atoms");
          const atoms = await response.json();

          let liveCnt = 0;
          let dustCnt = 0;
          let totalEnergy = 0;

          // Create a Set of current atom filenames fetched
          function getMoodColor(mood) {
            switch (mood) {
              case "AGGRESSIVE":
                return "#ef4444";
              case "HARMONIC":
                return "#10b981";
              case "CREATIVE":
                return "#8b5cf6";
              case "DEFENSIVE":
                return "#3b82f6";
              default:
                return "#10b981";
            }
          }

          // Initial fetch
          const fetchedFilenames = new Set(
            atoms.map((a) => a.filename),
          );

          // 1. Remove nodes that no longer exist (e.g. consumed dust, old names)
          for (const [filename, node] of atomNodes.entries()) {
            if (!fetchedFilenames.has(filename)) {
              node.remove();
              atomNodes.delete(filename);
            }
          }

          // 2. Add or update nodes
          atoms.forEach((atom) => {
            totalEnergy += atom.energy;
            if (atom.isDust || atom.energy <= 0) {
              dustCnt++;
            } else {
              liveCnt++;
            }

            const isAlive = !atom.isDust && atom.energy > 0;
            const ePct = Math.min(
              Math.max((atom.energy / 150) * 100, 0),
              100,
            );
            const eColor = getEnergyColor(atom.energy);

            let card = atomNodes.get(atom.filename);

            if (!card) {
              // Create new card
              card = document.createElement("div");
              card.className =
                `atom-card status-alive caste-${atom.caste}`;
              card.id = `atom-${atom.eigenvalue}`;
              card.setAttribute("data-filename", atom.filename);
              card.style.cursor = "pointer";
              card.style.left = `${atom.x / 1400 * 100}%`;
              card.style.top = `${atom.y / 800 * 100}%`;

              card.innerHTML = `
                            <div class="resonance-aura" style="opacity: ${
                Math.min(1, atom.resonance / 100)
              }"></div>
                            <div class="thought-hud" style="display: none;"></div>
                            <div class="caste-badge">${atom.caste}</div>
                            <div class="svg-container">${
                atom.svg ||
                '<div style="color: #444; font-family: monospace;">[NO SVG]</div>'
              }</div>
                            <div class="meta">
                                <h3 class="symbol">${atom.symbol}</h3>
                                ${
                atom.retroEigen
                  ? `<div class="retro-badge"><strong style="color:var(--accent)">FUTURE-LINK:</strong> _${atom.retroEigen}</div>`
                  : ""
              }
                                <div class="eigenvalue">${
                atom.eigenvalue.length > 18
                  ? atom.eigenvalue.substring(0, 18) + "<br/>_" +
                    atom.eigenvalue.substring(19)
                  : atom.eigenvalue.substring(0, 18)
              }</div>
                                <div class="energy-bar-container">
                                    <div class="energy-bar" style="width: ${ePct}%; background-color: ${eColor};"></div>
                                </div>
                                <div class="energy-text">${
                Math.floor(atom.energy)
              } NRG | <span style="color:var(--accent)">RES: ${
                atom.resonance ? atom.resonance.toFixed(1) : "0"
              }</span></div>
                            </div>
                        `;

              arena.appendChild(card);
              atomNodes.set(atom.filename, card);
            } else {
              // Update existing card data
              card.className = `atom-card ${
                isAlive ? "status-alive" : "status-dust"
              } ${
                atom.symbol.startsWith("ALPHA_") ? "status-alpha" : ""
              }`;

              // We only update the SVG if the eigenvalue changed (which implies file renamed, so new card usually, but just in case)
              // The energy block is what needs frequent updating
              // Update dynamic properties
              card.className =
                `atom-card status-alive caste-${atom.caste}`;
              const eBar = card.querySelector(".energy-bar");
              const eText = card.querySelector(".energy-text");
              const thoughtHud = card.querySelector(".thought-hud");
              if (thoughtHud) thoughtHud.innerText = atom.thought;

              eBar.style.width = `${ePct}%`;
              eBar.style.backgroundColor = eColor;
              eText.innerHTML = `${
                Math.floor(atom.energy)
              } NRG | <span style="color:var(--accent)">RES: ${
                atom.resonance ? atom.resonance.toFixed(1) : "0"
              }</span>`;
              card.querySelector(".energy-bar").style.width = `${
                Math.min(100, (atom.energy / 500) * 100)
              }%`;
              card.querySelector(".energy-text").textContent = Math
                .floor(atom.energy);
              card.querySelector(".caste-badge").textContent =
                atom.caste;

              // Handle Resonance Aura
              let aura = card.querySelector(".resonance-aura");
              if (!aura && isAlive) {
                aura = document.createElement("div");
                aura.className = "resonance-aura";
                card.appendChild(aura);
              }
              if (aura) {
                const resScale = 1 + (atom.resonance || 0) / 100;
                aura.style.transform = `scale(${resScale})`;
                aura.style.opacity = Math.min(
                  (atom.resonance || 0) / 50,
                  0.8,
                );
                if (!isAlive) aura.style.display = "none";
                else aura.style.display = "block";
              }

              // Apply physical position
              card.style.left = `${atom.x}px`;
              card.style.top = `${atom.y}px`;

              // Trigger pulse effect if signals present
              if (atom.signals && atom.signals.length > 0) {
                card.classList.add("status-pulsing");
                setTimeout(
                  () => card.classList.remove("status-pulsing"),
                  300,
                );
              }
            }
          });

          // Update stats
          elements.total.innerText = atoms.length;
          elements.live.innerText = liveCnt;
          elements.dust.innerText = dustCnt;
          elements.energy.innerText = Math.floor(totalEnergy);
          // --------------------------------------------------------------------------
          // --- MYCELIAL NETWORK RENDERER ---
          // Draw the synaptic bonds between atoms
          const mycelium = document.getElementById("mycelial-layer");
          mycelium.innerHTML = ""; // Clear old lines

          atoms.forEach((atom) => {
            if (atom.bonds && atom.bonds.length > 0) {
              atom.bonds.forEach((bondedEigen) => {
                const partner = atoms.find((a) =>
                  a.filename.includes(bondedEigen)
                );
                if (partner) {
                  // Line path
                  const path = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path",
                  );
                  path.setAttribute(
                    "d",
                    `M ${atom.x} ${atom.y} L ${partner.x} ${partner.y}`,
                  );
                  const strength = (atom.bondStrengths &&
                    atom.bondStrengths[bondedEigen]) || 1.0;
                  path.setAttribute(
                    "stroke",
                    `rgba(16, 185, 129, ${
                      0.1 + (Math.min(strength, 5) / 10)
                    })`,
                  );
                  path.setAttribute(
                    "stroke-width",
                    Math.max(strength, 0.5),
                  );
                  path.setAttribute("fill", "none");
                  mycelium.appendChild(path);
                }
              });
            }

            // Render Neural Pulses
            if (atom.signals && atom.signals.length > 0) {
              atom.signals.forEach((sig) => {
                const origin = atoms.find((a) =>
                  a.eigenvalue === sig.origin
                );
                if (origin) {
                  const dot = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle",
                  );
                  dot.setAttribute("r", "4");
                  let color = "#fff";
                  if (sig.type === "ENERGY") color = "#10b981";
                  else if (sig.type === "SHOCK") color = "#ef4444";

                  dot.setAttribute("fill", color);
                  dot.classList.add("signal-dot");

                  // Animate along the path from origin to current atom
                  const pathId = `path-${Math.random()}`;
                  const path = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path",
                  );
                  path.setAttribute("id", pathId);
                  path.setAttribute(
                    "d",
                    `M ${origin.x} ${origin.y} L ${atom.x} ${atom.y}`,
                  );
                  path.style.display = "none";
                  mycelium.appendChild(path);

                  dot.style.offsetPath =
                    `path('M ${origin.x} ${origin.y} L ${atom.x} ${atom.y}')`;
                  mycelium.appendChild(dot);

                  // Cleanup dot after animation
                  setTimeout(() => dot.remove(), 500);
                }
              });
            }
          });
          // --------------------------------------------------------------------------
        } catch (error) {
          console.error("Failed to fetch atoms:", error);
        }
      }

      // Hand of God Interactions
      arena.addEventListener("click", async (e) => {
        const card = e.target.closest(".atom-card");
        if (!card) return;
        const filename = card.getAttribute("data-filename");

        if (e.shiftKey) {
          // BLESS
          card.style.transform = "scale(1.2)";
          card.style.boxShadow =
            "inset 0 0 50px rgba(16, 185, 129, 0.8), 0 0 50px rgba(16, 185, 129, 0.8)";
          setTimeout(() => {
            card.style.transform = "";
            card.style.boxShadow = "";
          }, 300);
          await fetch(`/api/bless/${encodeURIComponent(filename)}`, {
            method: "POST",
          });
        } else {
          // FEED
          card.style.transform = "scale(1.1)";
          card.style.boxShadow =
            "inset 0 0 30px rgba(255, 255, 255, 0.5)";
          setTimeout(() => {
            card.style.transform = "";
            card.style.boxShadow = "";
          }, 200);
          await fetch(`/api/feed/${encodeURIComponent(filename)}`, {
            method: "POST",
          });
        }

        fetchAtoms();
      });

      arena.addEventListener("contextmenu", async (e) => {
        e.preventDefault();
        const card = e.target.closest(".atom-card");
        if (!card) return;
        const filename = card.getAttribute("data-filename");

        card.style.transform = "scale(0.9)";
        card.style.boxShadow = "inset 0 0 40px rgba(239,68,68,0.6)";
        setTimeout(() => {
          card.style.transform = "";
          card.style.boxShadow = "";
        }, 200);

        await fetch(`/api/zap/${encodeURIComponent(filename)}`, {
          method: "POST",
        });
        fetchAtoms();
      });

      // Fetch Akasha Logs
      async function fetchAkasha() {
        try {
          const res = await fetch("/api/akasha");
          const data = await res.json();
          const ticker = document.getElementById("akasha-log");

          let html = "";
          if (data.utterances && data.utterances.length > 0) {
            const tickerElement = document.getElementById(
              "story-ticker",
            );
            const lastIndex = data.utterances.length - 1;
            const latest = data.utterances[lastIndex];

            // Update ticker
            if (tickerElement) {
              document.getElementById("story-ticker-container").style
                .display = "block";

              const tickerHTML = data.utterances.map((u) => `
                  <div class="ticker-word" style="color: ${
                getMoodColor(u.mood)
              }">
                      <span>${u.text}</span>
                      <span class="ticker-origin">${u.origin}</span>
                  </div>
              `).join("");

              if (tickerElement.innerHTML !== tickerHTML) {
                tickerElement.innerHTML = tickerHTML;
              }
            }

            // Update mood visualizer
            if (latest.mood) {
              const overlay = document.getElementById("mood-overlay");
              overlay.style.background =
                `radial-gradient(circle at center, ${
                  getMoodColor(latest.mood)
                }, transparent 70%)`;
            }
          }
          if (data.logs && data.logs.length > 0) {
            html += data.logs.map((log) => `<span>${log}</span>`).join(
              "",
            );
          }

          if (html) {
            ticker.innerHTML = html;
            ticker.scrollLeft = ticker.scrollWidth;
          }

          // Update Sovereignty HUD
          const sov = data.sovereignty ||
            { activeDecree: "NONE", regent: "NONE", legitimacy: 0 };
          const regentEl = document.getElementById("regent-id");
          const decreeEl = document.getElementById("active-decree");
          const legitimacyEl = document.getElementById(
            "legitimacy-val",
          );
          const hud = document.getElementById("sov-hud");

          regentEl.textContent = sov.regent || "NONE";
          regentEl.className = sov.regent === "NONE"
            ? "sov-val none"
            : "sov-val";

          decreeEl.textContent = sov.label || "DEMOCRACY";
          decreeEl.className = sov.activeDecree === "NONE"
            ? "sov-val none"
            : "sov-val";

          legitimacyEl.textContent = `${
            Math.floor(sov.legitimacy || 0)
          }%`;
          legitimacyEl.className = sov.legitimacy > 0
            ? "sov-val"
            : "sov-val none";

          if (sov.regent !== "NONE") {
            hud.classList.add("active");
          } else {
            hud.classList.remove("active");
          }
        } catch {}
      }

      // Zero-IOPS Execution
      const zeroIopsBtn = document.getElementById("zero-iops-btn");
      zeroIopsBtn.addEventListener("click", async () => {
        zeroIopsBtn.style.transform = "scale(0.95)";
        zeroIopsBtn.style.boxShadow =
          "0 0 40px rgba(100, 100, 255, 0.8)";

        try {
          await fetch("/api/transmute", { method: "POST" });
          fetchAtoms();
        } catch (e) {}

        setTimeout(() => {
          zeroIopsBtn.style.transform = "";
          zeroIopsBtn.style.boxShadow = "";
        }, 500);
      });

      // Noospheric Forge Execution
      const forgeBtn = document.getElementById("forge-btn");
      forgeBtn.addEventListener("click", async () => {
        const symbol = document.getElementById("forge-symbol").value;
        const word = document.getElementById("forge-word").value;
        const logic = document.getElementById("forge-logic").value;
        const energy = document.getElementById("forge-energy").value;

        forgeBtn.style.transform = "scale(0.95)";
        forgeBtn.innerText = "SYNTHESIZING...";

        try {
          const payload = { symbol, energy };
          if (word) payload.word = word;
          else payload.logic = logic;

          await fetch("/api/forge", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          fetchAtoms();
        } catch (e) {}

        setTimeout(() => {
          forgeBtn.style.transform = "";
          forgeBtn.innerText = "SYNTHESIZE ATOM";
        }, 500);
      });

      // Fetch immediately, then poll
      fetchAtoms();
      fetchAkasha();
      setInterval(fetchAtoms, 1000);
      setInterval(fetchAkasha, 2000);
    </script>
  </body>
</html>
