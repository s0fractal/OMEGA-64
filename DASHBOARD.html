<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMEGA-64 | Petri Dish Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    >
    <style>
      :root {
        --bg-dark: #09090b;
        --glass-bg: rgba(24, 24, 27, 0.4);
        --glass-border: rgba(255, 255, 255, 0.08);
        --text-main: #f4f4f5;
        --text-dim: #a1a1aa;
        --accent: #10b981;
        --accent-glow: rgba(16, 185, 129, 0.2);
        --danger: #ef4444;
        --danger-glow: rgba(239, 68, 68, 0.2);
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: "Outfit", sans-serif;
        background-image:
          radial-gradient(
            circle at 15% 50%,
            rgba(20, 20, 30, 0.8),
            transparent 25%
          ),
          radial-gradient(
          circle at 85% 30%,
          rgba(20, 30, 20, 0.6),
          transparent 25%
        );
        background-attachment: fixed;
        min-height: 100vh;
      }

      header {
        padding: 2rem;
        text-align: center;
        border-bottom: 1px solid var(--glass-border);
        background: linear-gradient(
          180deg,
          rgba(9, 9, 11, 0.9) 0%,
          rgba(9, 9, 11, 0.4) 100%
        );
        backdrop-filter: blur(12px);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      h1 {
        margin: 0;
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: -0.05em;
        background: linear-gradient(to right, #fff, #a1a1aa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .subtitle {
        margin-top: 0.5rem;
        color: var(--text-dim);
        font-size: 1rem;
        font-weight: 300;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .stats-bar {
        display: flex;
        justify-content: center;
        gap: 2rem;
        margin-top: 1.5rem;
      }

      .stat-pill {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 9999px;
        padding: 0.5rem 1.5rem;
        font-size: 0.9rem;
        font-family: "JetBrains Mono", monospace;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }

      .stat-val {
        font-weight: bold;
        color: #fff;
      }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 2rem;
        padding: 3rem;
        max-width: 1600px;
        margin: 0 auto;
      }

      .atom-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        backdrop-filter: blur(16px);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
        overflow: hidden;
      }

      .atom-card:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .atom-card.status-dust {
        opacity: 0.5;
        filter: grayscale(100%);
      }

      .atom-card.status-dust:hover {
        transform: none;
        box-shadow: none;
        border-color: var(--glass-border);
      }

      .atom-card.retro-linked {
        border-color: rgba(249, 115, 22, 0.4);
        box-shadow: 0 0 20px rgba(249, 115, 22, 0.1) inset;
      }

      .svg-container {
        width: 200px;
        height: 200px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 1.5rem;
        filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.05));
      }

      .svg-container svg {
        width: 100%;
        height: 100%;
      }

      .meta {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .retro-badge {
        font-size: 0.65rem;
        color: rgba(255, 255, 255, 0.7);
        letter-spacing: 1px;
        background: rgba(249, 115, 22, 0.1);
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid rgba(249, 115, 22, 0.3);
        text-align: center;
        margin-top: -0.25rem;
        word-break: break-all;
      }

      .symbol {
        font-size: 1.25rem;
        font-weight: 600;
        text-align: center;
        letter-spacing: 0.05em;
        margin: 0;
      }

      .eigenvalue {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
        color: var(--text-dim);
        text-align: center;
        background: rgba(0, 0, 0, 0.3);
        padding: 0.25rem 0.5rem;
        border-radius: 6px;
        margin: 0;
      }

      .energy-bar-container {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        overflow: hidden;
        margin-top: 0.5rem;
      }

      .energy-bar {
        height: 100%;
        border-radius: 3px;
        transition: width 0.5s ease-out, background-color 0.5s ease;
      }

      .energy-text {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.75rem;
        color: var(--text-dim);
        text-align: right;
        margin-top: -0.25rem;
      }

      /* Ambient glowing pulses for active atoms */
      @keyframes pulse-glow {
        0% {
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0) inset;
        }
        50% {
          box-shadow: 0 0 40px 0 rgba(16, 185, 129, 0.05) inset;
        }
        100% {
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0) inset;
        }
      }

      .atom-card.status-alive {
        animation: pulse-glow 4s infinite ease-in-out;
      }

      .akashic-ticker {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(9, 9, 11, 0.95);
        border-top: 1px solid rgba(16, 185, 129, 0.3);
        backdrop-filter: blur(10px);
        padding: 0.75rem 2rem;
        display: flex;
        gap: 2rem;
        overflow-x: auto;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
        white-space: nowrap;
        z-index: 1000;
        scroll-behavior: smooth;
        color: var(--accent);
      }
      .akashic-ticker span {
        border-right: 1px solid var(--glass-border);
        padding-right: 2rem;
      }
      .akashic-ticker span:last-child {
        border-right: none;
      }

      body { padding-bottom: 50px; } /* Room for ticker */
    </style>
  </head>
  <body>
    <header>
      <h1>PETRI DISH // OMEGA-64</h1>
      <div class="subtitle">Live Flatland Telemetry</div>

      <div class="stats-bar">
        <div class="stat-pill">
          TOTAL ATOMS: <span class="stat-val" id="total-count">0</span>
        </div>
        <div class="stat-pill" style="border-color: rgba(16, 185, 129, 0.3)">
          LIVING: <span
            class="stat-val"
            id="live-count"
            style="color: var(--accent)"
          >0</span>
        </div>
        <div class="stat-pill" style="border-color: rgba(239, 68, 68, 0.3)">
          DUST: <span
            class="stat-val"
            id="dust-count"
            style="color: var(--danger)"
          >0</span>
        </div>
        <div class="stat-pill">
          SYS. ENERGY: <span class="stat-val" id="sys-energy">0</span>
        </div>
      </div>
    </header>

    <div class="grid-container" id="grid">
      <!-- Atoms injected here via JS -->
    </div>

    <div class="akashic-ticker" id="akasha-log">
      <span>[AKASHA] Awaiting telemetry...</span>
    </div>

    <script>
      const grid = document.getElementById("grid");
      const elements = {
        total: document.getElementById("total-count"),
        live: document.getElementById("live-count"),
        dust: document.getElementById("dust-count"),
        energy: document.getElementById("sys-energy"),
      };

      // Track existing atoms in DOM to update instead of re-rendering completely
      // to prevent SVG animation resets if the code didn't change
      let atomNodes = new Map();

      function getEnergyColor(energy) {
        if (energy >= 140) return "#8b5cf6"; // Fission ready (purple)
        if (energy >= 100) return "#10b981"; // Healthy (green)
        if (energy >= 50) return "#eab308"; // Warning (yellow)
        return "#ef4444"; // Starving (red)
      }

      async function fetchAtoms() {
        try {
          const response = await fetch("/api/atoms");
          const atoms = await response.json();

          let liveCnt = 0;
          let dustCnt = 0;
          let totalEnergy = 0;

          // Create a Set of current atom filenames fetched
          const fetchedFilenames = new Set(
            atoms.map((a) => a.filename),
          );

          // 1. Remove nodes that no longer exist (e.g. consumed dust, old names)
          for (const [filename, node] of atomNodes.entries()) {
            if (!fetchedFilenames.has(filename)) {
              node.remove();
              atomNodes.delete(filename);
            }
          }

          // 2. Add or update nodes
          atoms.forEach((atom) => {
            totalEnergy += atom.energy;
            if (atom.isDust || atom.energy <= 0) {
              dustCnt++;
            } else {
              liveCnt++;
            }

            const isAlive = !atom.isDust && atom.energy > 0;
            const ePct = Math.min(
              Math.max((atom.energy / 150) * 100, 0),
              100,
            );
            const eColor = getEnergyColor(atom.energy);

            let card = atomNodes.get(atom.filename);

            if (!card) {
              // Create new card
              card = document.createElement("div");
              card.className = `atom-card ${
                isAlive ? "status-alive" : "status-dust"
              } ${atom.retroEigen ? "retro-linked" : ""}`;
              card.setAttribute("data-filename", atom.filename);
              card.style.cursor = "pointer";

              card.innerHTML = `
                            <div class="svg-container">${
                atom.svg ||
                '<div style="color: #444; font-family: monospace;">[NO SVG]</div>'
              }</div>
                            <div class="meta">
                                <h3 class="symbol">${atom.symbol}</h3>
                                ${atom.retroEigen ? `<div class="retro-badge"><strong style="color:var(--accent)">FUTURE-LINK:</strong> _${atom.retroEigen}</div>` : ''}
                                <div class="eigenvalue">${
                atom.eigenvalue.length > 18 ? 
                  atom.eigenvalue.substring(0,18) + '<br/>_' + atom.eigenvalue.substring(19) : 
                  atom.eigenvalue.substring(0, 18)
              }</div>
                                <div class="energy-bar-container">
                                    <div class="energy-bar" style="width: ${ePct}%; background-color: ${eColor};"></div>
                                </div>
                                <div class="energy-text">${
                Math.floor(atom.energy)
              } NRG</div>
                            </div>
                        `;

              grid.appendChild(card);
              atomNodes.set(atom.filename, card);
            } else {
              // Update existing card data
              card.className = `atom-card ${
                isAlive ? "status-alive" : "status-dust"
              }`;

              // We only update the SVG if the eigenvalue changed (which implies file renamed, so new card usually, but just in case)
              // The energy block is what needs frequent updating
              const eBar = card.querySelector(".energy-bar");
              const eText = card.querySelector(".energy-text");

              eBar.style.width = `${ePct}%`;
              eBar.style.backgroundColor = eColor;
              eText.innerText = `${Math.floor(atom.energy)} NRG`;
            }
          });

          // Update stats
          elements.total.innerText = atoms.length;
          elements.live.innerText = liveCnt;
          elements.dust.innerText = dustCnt;
          elements.energy.innerText = Math.floor(totalEnergy);
        } catch (error) {
          console.error("Failed to fetch atoms:", error);
        }
      }

      // Hand of God Interactions
      grid.addEventListener("click", async (e) => {
        const card = e.target.closest(".atom-card");
        if (!card) return;
        const filename = card.getAttribute("data-filename");
        
        card.style.transform = "scale(1.1)";
        setTimeout(() => card.style.transform = "", 200);

        await fetch(`/api/feed/${encodeURIComponent(filename)}`, { method: "POST" });
        fetchAtoms();
      });

      grid.addEventListener("contextmenu", async (e) => {
        e.preventDefault();
        const card = e.target.closest(".atom-card");
        if (!card) return;
        const filename = card.getAttribute("data-filename");
        
        card.style.transform = "scale(0.9)";
        card.style.boxShadow = "inset 0 0 40px rgba(239,68,68,0.6)";
        setTimeout(() => {
            card.style.transform = "";
            card.style.boxShadow = "";
        }, 200);

        await fetch(`/api/zap/${encodeURIComponent(filename)}`, { method: "POST" });
        fetchAtoms();
      });

      // Fetch Akasha Logs
      async function fetchAkasha() {
        try {
            const res = await fetch("/api/akasha");
            const data = await res.json();
            const ticker = document.getElementById("akasha-log");
            if (data.logs && data.logs.length > 0) {
                ticker.innerHTML = data.logs.map((log) => `<span>${log}</span>`).join("");
                ticker.scrollLeft = ticker.scrollWidth;
            }
        } catch { }
      }

      // Fetch immediately, then poll
      fetchAtoms();
      fetchAkasha();
      setInterval(fetchAtoms, 1000);
      setInterval(fetchAkasha, 2000);
    </script>
  </body>
</html>
