<!DOCTYPE html>
<html>
    <head>
        <title>Q-Space Visualizer</title>
        <style>
            body { margin: 0; overflow: hidden; background-color: #000; color: #0f0; font-family: monospace; }
            #info { position: absolute; top: 10px; left: 10px; pointer-events: none; }
            #tooltip {
                position: absolute;
                background: rgba(0, 20, 0, 0.9);
                border: 1px solid #0f0;
                padding: 10px;
                display: none;
                pointer-events: none;
                font-size: 12px;
                white-space: pre;
                z-index: 100;
                box-shadow: 0 0 10px #0f0;
            }
            .force-row { display: flex; justify-content: space-between; gap: 10px; }
            .val { color: #fff; }
        </style>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    </head>
    <body>
        <div id="info">
            Q-SPACE VISUALIZER (PHYSICS DEBUG MODE)<br>
            L (Radius) | D (Angle) | V (Height)<br>
            Hover over atoms to see Physics Context.
        </div>
        <div id="tooltip"></div>
        <script>
            let scene, camera, renderer, controls, raycaster, mouse;
            let atoms = [];
            let cloud;
            let atomMap = new Map();

            async function init() {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.z = 100;

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);

                controls = new THREE.OrbitControls(camera, renderer.domElement);
                
                raycaster = new THREE.Raycaster();
                raycaster.params.Points.threshold = 1.0;
                mouse = new THREE.Vector2();

                // Fetch Data
                const response = await fetch("./q_data.json");
                const data = await response.json();

                const geometry = new THREE.BufferGeometry();
                const positions = [];
                const colors = [];

                const colorAligned = new THREE.Color(0x00ff00);
                const colorTension = new THREE.Color(0xff0000);

                data.nodes.forEach((atom) => {
                    const r = atom.L;
                    const theta = (atom.D / 64) * Math.PI * 2;
                    const x = r * Math.cos(theta);
                    const y = r * Math.sin(theta);
                    const z = (atom.V || 0) * 2 - 16; 

                    positions.push(x, y, z);
                    atomMap.set(atom.id, { ...atom, x, y, z }); // Store layout data

                    const tension = atom.tension || 0;
                    let color = new THREE.Color();

                    if (atom.isMirror) {
                        color.setHex(0x00ffff);
                    } else if (atom.L > 60) {
                        color.setHex(0xffd700);
                    } else {
                        color.lerpColors(colorAligned, colorTension, tension / 20);
                    }
                    colors.push(color.r, color.g, color.b);
                });

                geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
                geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));

                const material = new THREE.PointsMaterial({ size: 1.2, vertexColors: true, opacity: 0.9, transparent: true });
                cloud = new THREE.Points(geometry, material);
                scene.add(cloud);

                // Render Links
                if (data.links) {
                    const linkGeo = new THREE.BufferGeometry();
                    const linkPos = [];
                    data.links.forEach(link => {
                        const p1 = atomMap.get(link.source);
                        const p2 = atomMap.get(link.target);
                        if (p1 && p2) {
                            linkPos.push(p1.x, p1.y, p1.z);
                            linkPos.push(p2.x, p2.y, p2.z);
                        }
                    });
                    linkGeo.setAttribute('position', new THREE.Float32BufferAttribute(linkPos, 3));
                    const linkMat = new THREE.LineBasicMaterial({ color: 0x444444, opacity: 0.3, transparent: true });
                    scene.add(new THREE.LineSegments(linkGeo, linkMat));
                }

                // Axes & Rings
                scene.add(new THREE.AxesHelper(10));
                for (let r = 10; r <= 60; r += 10) {
                    const ring = new THREE.Mesh(
                        new THREE.RingGeometry(r - 0.1, r + 0.1, 64),
                        new THREE.MeshBasicMaterial({ color: 0x333333, side: THREE.DoubleSide })
                    );
                    scene.add(ring);
                }

                window.addEventListener('mousemove', onMouseMove, false);
                window.addEventListener("resize", onResize);
                animate();
            }

            function onMouseMove(event) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                
                checkIntersection(event.clientX, event.clientY);
            }

            function checkIntersection(mx, my) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(cloud);
                const tooltip = document.getElementById('tooltip');

                if (intersects.length > 0) {
                    const index = intersects[0].index;
                    // Find atom by index (iterating Map is slow, but we need data)
                    // We pushed positions in order, so Array.from(atomMap.values())[index] works
                    const atom = Array.from(atomMap.values())[index];
                    
                    if (atom) {
                        const name = atom.id.replace(/i\.L\d+\.core\./, '').replace('.ts', '').replace('mirror.', 'M::');
                        let debugHtml = '';
                        
                        if (atom.debug) {
                            const f = (v) => v ? v.toFixed(3) : '0';
                            const vec = (o) => `(${f(o.x)}, ${f(o.y)})`;
                            debugHtml = `
<div class="force-row"><span>Attr:</span><span class="val">${vec(atom.debug.attraction)}</span></div>
<div class="force-row"><span>Repul:</span><span class="val">${vec(atom.debug.repulsion)}</span></div>
<div class="force-row"><span>Orbit:</span><span class="val">${vec(atom.debug.orbital)}</span></div>
<div class="force-row"><span>Spring:</span><span class="val">${vec(atom.debug.spring)}</span></div>`;
                        }

                        tooltip.innerHTML = `<strong>${name}</strong>
Level: <span class="val">${(atom.level || (64-atom.L)).toFixed(1)}</span> (Target: ${atom.level ? 'Fixed' : '?'})
Radius: <span class="val">${atom.L.toFixed(2)}</span>
D: <span class="val">${atom.D}</span>
V: <span class="val">${atom.V}</span>
Mass/Deps: <span class="val">${atom.tension}</span>
<hr style="border:0; border-top:1px solid #336633">
${debugHtml}`;
                        
                        tooltip.style.display = 'block';
                        tooltip.style.left = mx + 15 + 'px';
                        tooltip.style.top = my + 15 + 'px';
                    }
                } else {
                    tooltip.style.display = 'none';
                }
            }

            function onResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }

            init();
        </script>
    </body>
</html>
